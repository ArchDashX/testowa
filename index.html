<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adisbro | Profile</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #141417;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --tiktok-color: #ff0050;
            --discord-color: #5865F2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
        }

        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 20px 20px 25px 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            animation: floatIn 0.8s ease-out;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #222;
            min-height: 200px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
            position: relative;
            z-index: 2;
        }

        .image-container:hover img {
            transform: scale(1.03);
        }

        .profile-info {
            text-align: center;
            margin-bottom: 28px;
        }

        .name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .verified-badge {
            color: #3b82f6;
            font-size: 1.2rem;
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn i {
            font-size: 1.3rem;
        }

        .arrow-icon {
            opacity: 0.3;
            font-size: 1rem !important;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .btn:hover .arrow-icon {
            opacity: 1;
            transform: translateX(4px);
        }

        .btn-tiktok:hover {
            background: rgba(255, 0, 80, 0.1);
            border-color: rgba(255, 0, 80, 0.3);
        }
        .btn-tiktok i.fa-brands { color: var(--tiktok-color); }

        .btn-discord:hover {
            background: rgba(88, 101, 242, 0.1);
            border-color: rgba(88, 101, 242, 0.3);
        }
        .btn-discord i.fa-brands { color: var(--discord-color); }

        /* --- FOOTER / REGULAMIN LINK --- */
        .footer-links {
            margin-top: 25px;
            text-align: center;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* --- TOAST --- */
        .toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #27272a;
            color: white;
            padding: 14px 24px;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .toast.show { bottom: 30px; }
        .toast i { color: #22c55e; }
    </style>
</head>
<body>

    <main class="card">
        
        <div class="image-container">
            <img src="profil.jpg" 
                 alt="adisbro" 
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'padding: 50px 20px; text-align: center; color: #ff5f56; font-weight: bold;\'><i class=\'fa-solid fa-triangle-exclamation\'></i><br><br>Błąd: Nie znaleziono pliku o nazwie<br><b>profil.jpg</b><br>we właściwym folderze.</div>'">
        </div>

        <div class="profile-info">
            <h1 class="name">
                adisbro 
                <i class="fa-solid fa-circle-check verified-badge" title="Verified"></i>
            </h1>
            <p class="bio">Content Creator & Gamer</p>
        </div>

        <div class="links">
            <a href="https://www.tiktok.com/@adisburoo" target="_blank" class="btn btn-tiktok">
                <div class="btn-content">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>Follow on TikTok</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <div class="btn btn-discord" onclick="copyDiscord()">
                <div class="btn-content">
                    <i class="fa-brands fa-discord"></i>
                    <span>adisbro.</span>
                </div>
                <i class="fa-regular fa-copy arrow-icon"></i>
            </div>
        </div>

        <!-- Link do Regulaminu -->
        <div class="footer-links">
            <a href="regulamin.html">Terms of Service / Rules</a>
        </div>
    </main>

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span>Discord copied!</span>
    </div>

    <script>
        function copyDiscord() {
            navigator.clipboard.writeText("adisbro.").then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => { toast.classList.remove("show"); }, 2500);
            });
        }
    </script>
</body>
</html>
