<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adisburoo | Official</title>
    <!-- Czcionka z Google Fonts dla nowoczesnego wyglądu -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <!-- Ikony dla programistów (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Reset i podstawowe zmienne */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        :root {
            --bg-color: #0d1117; /* Ciemne tło jak w GitHubie */
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --accent-1: #00f2fe; /* Neonowy błękit */
            --accent-2: #4facfe;
            --tiktok: #ff0050;
            --discord: #5865F2;
        }

        /* Tło z animowanym gradientem */
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.08), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(0, 242, 254, 0.08), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Główny kontener (szklany efekt) */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
            position: relative;
            z-index: 10;
        }

        /* Animacja wejścia */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Zdjęcie profilowe z poświatą */
        .profile-img-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        /* Animowana aureola wokół zdjęcia */
        .profile-img-container::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, var(--accent-1), var(--accent-2), var(--tiktok));
            border-radius: 50%;
            z-index: 1;
            filter: blur(10px);
            opacity: 0.7;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            100% { transform: scale(1.05); opacity: 0.8; }
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        /* Teksty */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #b3b3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tagline i {
            color: var(--accent-1);
        }

        /* Przyciski / Linki */
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        /* Efekt najechania na przycisk */
        .link-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.5);
        }

        .link-btn i {
            font-size: 1.4rem;
            transition: transform 0.3s ease;
        }

        .link-btn:hover i {
            transform: scale(1.2) rotate(5deg);
        }

        /* Kolory specyficzne dla platform */
        .link-btn.tiktok:hover {
            border-color: var(--tiktok);
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.3);
        }
        .link-btn.tiktok i { color: var(--tiktok); }

        .link-btn.discord:hover {
            border-color: var(--discord);
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.3);
        }
        .link-btn.discord i { color: var(--discord); }

        /* Stopka */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Animowane tło (kropki) */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: moveBackground 20s linear infinite;
            opacity: 0.3;
        }

        @keyframes moveBackground {
            from { background-position: 0 0; }
            to { background-position: 30px 30px; }
        }

    </style>
</head>
<body>

    <!-- Animowane tło -->
    <div class="bg-animation"></div>

    <!-- Główna karta -->
    <div class="container">
        
        <!-- Zdjęcie (podmień src na swoje zdjęcie) -->
        <div class="profile-img-container">
            <!-- Upewnij się, że plik ze zdjęciem nazywa się zdjecie.jpg i jest w tym samym folderze -->
            <img src="zdjecie.jpg" alt="Adisburoo" class="profile-img">
        </div>

        <h1>adisburoo</h1>
        <p class="tagline"><i class="fa-solid fa-code"></i> Content Creator & Gamer</p>

        <div class="links">
            <!-- Link do TikToka -->
            <a href="https://www.tiktok.com/@adisburoo" target="_blank" class="link-btn tiktok">
                <i class="fa-brands fa-tiktok"></i>
                TikTok
            </a>

            <!-- Link do Discorda -->
            <a href="https://discord.com/users/adisbro." target="_blank" class="link-btn discord">
                <i class="fa-brands fa-discord"></i>
                adisbro.
            </a>
        </div>

        <div class="footer">
            &copy; 2024 adisburoo. All rights reserved.
        </div>
    </div>

</body>
</html>
